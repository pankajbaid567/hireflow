<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Controlled Greenhouse-shaped public form</title></head><body>
<h1>Owned public ATS fixture — no employer submission</h1><form id="application_form" method="post" action="/submit" enctype="multipart/form-data">
<label for="first_name">First Name</label><input id="first_name" name="job_application[first_name]" required>
<label for="last_name">Last Name</label><input id="last_name" name="job_application[last_name]" required>
<label for="email">Email</label><input id="email" name="job_application[email]" type="email" required>
<label for="phone">Phone</label><input id="phone" name="job_application[phone]" type="tel">
<label for="resume">Resume/CV</label><input id="resume" name="resume" type="file" required accept=".pdf">
<button id="submit_app" type="submit">Submit Application</button></form>
</body></html>
