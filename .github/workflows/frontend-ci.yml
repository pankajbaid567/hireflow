name: Frontend CI

on:
  pull_request:
    paths: ['frontend/**', 'scripts/deploy_cloudflare_pages.mjs', '.github/workflows/frontend-ci.yml']
  push:
    branches: [main, dev]
    paths: ['frontend/**', 'scripts/deploy_cloudflare_pages.mjs', '.github/workflows/frontend-ci.yml']

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
